name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Gradle
        run: |
          # আমরা প্রথমে খুঁজে দেখছি gradlew কোথায় আছে
          find . -name "gradlew"
          # তারপর সেখানেই কাজ করব
          chmod +x $(find . -name "gradlew")
          $(find . -name "gradlew") assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-Survival-APK
          path: "**/*.apk"
