name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare dist folder
        run: |
          rm -rf dist
          mkdir -p dist

          cp index.html dist/

          if [ -d "assets" ]; then
            cp -r assets dist/assets
          fi

          if [ -d "android-icons" ]; then
            cp -r android-icons dist/android-icons
          fi

          find . -maxdepth 1 -type f \( \
            -name "*.css" -o \
            -name "*.js" -o \
            -name "*.png" -o \
            -name "*.jpg" -o \
            -name "*.jpeg" -o \
            -name "*.webp" -o \
            -name "*.svg" -o \
            -name "*.ico" \
          \) -exec cp {} dist/ \;

          ls -la dist

      - name: Update Capacitor config
        run: |
          node -e "
          const fs = require('fs');
          let config = {};
          if (fs.existsSync('capacitor.config.json')) {
            config = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
          }
          config.appId = config.appId || 'com.ashik9798.ultimatesurvival';
          config.appName = config.appName || 'Ultimate Survival';
          config.webDir = 'dist';
          fs.writeFileSync('capacitor.config.json', JSON.stringify(config, null, 2));
          "

      - name: Create/Sync Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-Survival-APK
          path: android/app/build/outputs/apk/debug/*.apk
